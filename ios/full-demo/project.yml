name: ScannerSDKiOSDemo
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  ScannerSDK:
    url: https://github.com/netumscan/scanner-sdk-ios.git
    branch: main
targets:
  ScannerSDKiOSDemo:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ScannerSDKiOSDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netumscan.scannersdk.demo.ios
        PRODUCT_NAME: ScannerSDKiOSDemo
        SWIFT_VERSION: "5.9"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: 用于连接扫描枪设备并接收扫码数据
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: 用于连接扫描枪设备并接收扫码数据
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ScannerSDK
        product: ScannerSDK
  ScannerSDKiOSDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ScannerSDKiOSDemoTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netumscan.scannersdk.demo.ios.tests
        PRODUCT_NAME: ScannerSDKiOSDemoTests
        SWIFT_VERSION: "5.9"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScannerSDKiOSDemo
      - package: ScannerSDK
        product: ScannerSDK
  ScannerSDKiOSDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ScannerSDKiOSDemoUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netumscan.scannersdk.demo.ios.uitests
        PRODUCT_NAME: ScannerSDKiOSDemoUITests
        SWIFT_VERSION: "5.9"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: ScannerSDKiOSDemo
