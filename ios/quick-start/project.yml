name: ScannerSDKQuickStart
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  ScannerSDK:
    url: https://github.com/netumscan/scanner-sdk-ios.git
    from: "1.0.0"
targets:
  ScannerSDKQuickStart:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ScannerSDKQuickStart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netumscan.scannersdk.quickstart.ios
        PRODUCT_NAME: ScannerSDKQuickStart
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 12
        SWIFT_VERSION: "5.9"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: Discover and connect to barcode scanners over Bluetooth.
        INFOPLIST_KEY_NSBluetoothPeripheralUsageDescription: Discover and connect to barcode scanners over Bluetooth.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: ScannerSDK
        product: ScannerSDK
  ScannerSDKQuickStartTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ScannerSDKQuickStartTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.netumscan.scannersdk.quickstart.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.9"
    dependencies:
      - target: ScannerSDKQuickStart
      - package: ScannerSDK
        product: ScannerSDK
schemes:
  ScannerSDKQuickStart:
    build:
      targets:
        ScannerSDKQuickStart: all
        ScannerSDKQuickStartTests:
          - test
    test:
      targets:
        - ScannerSDKQuickStartTests
